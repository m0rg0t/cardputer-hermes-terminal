; Cardputer ADV Hermes Terminal

[platformio]
default_envs = cardputer-adv-hermes

[env:cardputer-adv-hermes]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<sim/>
extra_scripts =
    pre:scripts/embed_admin.py
    post:scripts/check_m5apps_size.py
build_flags =
    -DHERMES_WEB_ADMIN=0
    -DHERMES_MDNS=0
    -DHERMES_SLEEP_STATES=1
    -DHERMES_WEB_COMPACT_STATUS=0
    -Wl,--wrap=esp_wifi_init
    -fmerge-all-constants
lib_deps =
    m5stack/M5Unified@0.2.17
    https://github.com/m5stack/M5GFX.git#0.2.22
    m5stack/M5Cardputer@1.1.1
    bblanchon/ArduinoJson@7.4.2

[env:cardputer-adv-hermes-web]
extends = env:cardputer-adv-hermes
build_unflags =
    -fno-lto
build_src_flags =
    -flto
build_flags =
    -DHERMES_WEB_ADMIN=1
    -DHERMES_MDNS=0
    -DHERMES_SLEEP_STATES=0
    -DHERMES_WEB_COMPACT_STATUS=1
    -Wl,--wrap=esp_wifi_init
    -fmerge-all-constants

; Desktop UI preview (not a device target, not built by CI). Compiles the
; real drawing unit against the M5GFX SDL backend with stubbed hardware.
; See sim/README.md.
[env:native-sim]
platform = native
build_type = debug
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.22
build_src_filter =
    -<*>
    +<app_draw.cpp>
    +<sim/>
build_flags =
    -std=gnu++17
    -O1
    -DHERMES_SIM
    -DHERMES_SLEEP_STATES=1
    -DM5GFX_BOARD=board_M5Cardputer
    -DM5GFX_SCALE=3
    -Isim/stubs
    -Iinclude
    -Isrc
    !sdl2-config --cflags
    !sdl2-config --libs
