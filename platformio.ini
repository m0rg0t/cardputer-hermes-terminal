; Cardputer ADV Hermes Terminal

[platformio]
default_envs = cardputer-adv-hermes

[env:cardputer-adv-hermes]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:scripts/embed_admin.py
    post:scripts/check_m5apps_size.py
build_flags =
    -DHERMES_WEB_ADMIN=0
    -DHERMES_MDNS=0
    -DHERMES_SLEEP_STATES=1
    -DHERMES_WEB_COMPACT_STATUS=0
    -Wl,--wrap=esp_wifi_init
    -fmerge-all-constants
lib_deps =
    m5stack/M5Unified@0.2.17
    https://github.com/m5stack/M5GFX.git#0.2.22
    m5stack/M5Cardputer@1.1.1
    bblanchon/ArduinoJson@7.4.2

[env:cardputer-adv-hermes-web]
extends = env:cardputer-adv-hermes
build_unflags =
    -fno-lto
build_src_flags =
    -flto
build_flags =
    -DHERMES_WEB_ADMIN=1
    -DHERMES_MDNS=0
    -DHERMES_SLEEP_STATES=0
    -DHERMES_WEB_COMPACT_STATUS=1
    -Wl,--wrap=esp_wifi_init
    -fmerge-all-constants
